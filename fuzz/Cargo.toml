[package]
name = "arithmetica-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
# The oracles evaluate integer determinants over coordinates scaled by 2^1074,
# so `num-bigint` alone is enough.
num-bigint = "=0.4.6"

[dependencies.arithmetica]
path = ".."

[[bin]]
name = "orient2d"
path = "fuzz_targets/orient2d.rs"
doc = false

[[bin]]
name = "orient2d_oracle"
path = "fuzz_targets/orient2d_oracle.rs"
doc = false

[[bin]]
name = "incircle"
path = "fuzz_targets/incircle.rs"
doc = false

[[bin]]
name = "incircle_oracle"
path = "fuzz_targets/incircle_oracle.rs"
doc = false

[[bin]]
name = "orient3d"
path = "fuzz_targets/orient3d.rs"
doc = false

[[bin]]
name = "orient3d_oracle"
path = "fuzz_targets/orient3d_oracle.rs"
doc = false

[[bin]]
name = "insphere"
path = "fuzz_targets/insphere.rs"
doc = false

[[bin]]
name = "insphere_oracle"
path = "fuzz_targets/insphere_oracle.rs"
doc = false

[[bin]]
name = "compare_distance"
path = "fuzz_targets/compare_distance.rs"
doc = false

[[bin]]
name = "dot_sign"
path = "fuzz_targets/dot_sign.rs"
doc = false

[[bin]]
name = "compare_point_distance"
path = "fuzz_targets/compare_point_distance.rs"
doc = false

[[bin]]
name = "compare_segment_distance"
path = "fuzz_targets/compare_segment_distance.rs"
doc = false
